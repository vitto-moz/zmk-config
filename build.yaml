# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
# This repo tracks two keyboards, both on SuperMini nRF52840 (nice!nano-
# compatible pinout, hence `nice_nano//zmk`) — the `zmk` variant suffix is
# required since the Zephyr 4.1 board-variant change. Both build here on
# every push/PR. To build just one on demand, use the "Build one keyboard"
# workflow (Actions tab -> Run workflow -> keyboard: corne or
# splitkb_aurora_corne), which builds from build/corne.yaml or
# build/splitkb_aurora_corne.yaml instead.
#
# corne_left/corne_right             -> Mifuny Corne v3 Choc v1
# splitkb_aurora_corne_left/right    -> splitkb.com Aurora Corne
---
include:
  - board: nice_nano//zmk
    shield: corne_left
  - board: nice_nano//zmk
    shield: corne_right
  - board: nice_nano//zmk
    shield: splitkb_aurora_corne_left
  - board: nice_nano//zmk
    shield: splitkb_aurora_corne_right
  - board: nice_nano//zmk
    shield: settings_reset
