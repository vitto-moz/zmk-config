# Keyboard 1: SuperMini nRF52840 + Mifuny Corne v3 Choc v1
#
# Kconfig fragment files can't #include a shared file, so the base settings
# below are intentionally duplicated from splitkb_aurora_corne.conf. Keep
# the two in sync when tuning shared BT/clock behavior.

# Uncomment these two line to add support for encoders to your firmware
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Kyria OLED Display
# CONFIG_ZMK_DISPLAY=y

# Per-key RGB ("leg lights"), 21 LEDs per half. Hardware defined in the
# local shield override at boards/shields/corne/corne.dtsi.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# 2Mbps PHY trades range for throughput; forcing 1M PHY fixes intermittent
# drops on some BT chipsets (common on Windows Realtek/Intel, older Macs).
CONFIG_BT_CTLR_PHY_2M=n

# --- TEMPORARY diagnostic only: revert after this test ---
# Fully disabling the radio to test whether BLE scheduling is interrupting
# the WS2812 SPI transfer and corrupting the LED chain partway through.
# Split depends on BT, so it has to come off too -- this build is USB-only,
# left half standalone, just to observe boot-time underglow/per-key LEDs
# (CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y above means no key presses needed).
CONFIG_BT=n
CONFIG_ZMK_SPLIT=n