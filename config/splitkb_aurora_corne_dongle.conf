# Halcyon Dongle acting as BLE central for the splitkb.com Aurora Corne
# (https://docs.splitkb.com/product-guides/halcyon-dongle/firmware).
#
# Kconfig fragment files can't #include a shared file, so these base
# settings are intentionally duplicated from splitkb_aurora_corne.conf. Keep
# the two in sync when tuning shared BT/clock behavior.

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# 2Mbps PHY trades range for throughput; forcing 1M PHY fixes intermittent
# drops on some BT chipsets (common on Windows Realtek/Intel, older Macs).
CONFIG_BT_CTLR_PHY_2M=n

# The halcyon_dongle board defaults this to n (it assumes USB-only dongle
# use). Re-enable it so the dongle can also pair over BLE to a second host
# and switch output between USB and that BLE profile via &out OUT_TOG.
CONFIG_ZMK_BLE_PROFILE_ADVERTISING=y
